    <path d="M 5.5 5.5 L 10.5 10.5 M 10.5 5.5 L 5.5 10.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- pressed-center: 48 0 16 16 -->
