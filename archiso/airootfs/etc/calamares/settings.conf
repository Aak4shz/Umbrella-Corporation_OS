# ==============================================================================
# Umbrella OS - Calamares System Installer Settings
# ==============================================================================
---
modules-search:
  - /usr/lib/calamares/modules
  - local

instances:
  - id:       cleanup
    module:   packages
    config:   packages.conf
  - id:       archisocleanup
    module:   shellprocess
    config:   shellprocess-archisocleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - shellprocess@archisocleanup
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - services-systemd
      - packages@cleanup
      - umount
  - show:
      - finished

branding: umbrella

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
