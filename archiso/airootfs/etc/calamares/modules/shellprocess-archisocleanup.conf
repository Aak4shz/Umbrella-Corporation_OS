# ==============================================================================
# Umbrella OS - Calamares shellprocess Archiso Cleanup
# ==============================================================================
# Runs inside the target system chroot prior to initcpio generation:
# 1. Purges archiso-specific mkinitcpio hooks so target kernel boots from disk
# 2. Sets up Plymouth KMS hook in /etc/mkinitcpio.conf for flicker-free boot
# 3. Removes ephemeral livecd services and mounts
---
dontChroot: false
timeout: 60
script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "-rm -rf /etc/systemd/system/etc-pacman.d-gnupg.mount"
    - "-sed -i 's/^HOOKS=.*/HOOKS=(base udev plymouth autodetect modconf kms block filesystems keyboard fsck)/' /etc/mkinitcpio.conf"
