# ==============================================================================
# Umbrella OS - Calamares services-systemd Module Configuration
# ==============================================================================
---
services:
  - name: "NetworkManager"
    mandatory: true
  - name: "sddm"
    mandatory: true
  - name: "fstrim.timer"
    mandatory: false
  - name: "docker"
    mandatory: false
  - name: "ollama"
    mandatory: false

disable:
  - name: "umbrella-live-init.service"
    mandatory: false
  - name: "choose-mirror.service"
    mandatory: false
  - name: "livecd-talk.service"
    mandatory: false
  - name: "livecd-alsa-unmuter.service"
    mandatory: false
  - name: "pacman-init.service"
    mandatory: false

targets:
  - name: "graphical"
    mandatory: true
