# ==============================================================================
# Umbrella OS - Calamares fstab Module Configuration
# ==============================================================================
---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime,compress=zstd
    ext4: defaults,noatime

efiMountOptions: umask=0077

ssd:
    mountOptions:
        default: defaults,noatime
        btrfs: defaults,noatime,compress=zstd
        ext4: defaults,noatime
