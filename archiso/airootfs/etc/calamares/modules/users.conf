# ==============================================================================
# Umbrella OS - Calamares Users Module Configuration
# ==============================================================================
---
defaultGroups:
    - lp
    - audio
    - video
    - network
    - storage
    - wheel
    - docker
    - input
    - users

autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
defaultShell: /bin/zsh
