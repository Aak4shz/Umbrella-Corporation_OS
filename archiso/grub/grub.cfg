# ════════════════════════════════════════════════════════════════════
# UMBRELLA OS — GRUB Boot Menu Configuration
# "Protecting Tomorrow's World, Today."
# ════════════════════════════════════════════════════════════════════

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat

set default=umbrella-os
set timeout=5
set timeout_style=menu

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    insmod gfxterm
    terminal_output gfxterm
fi

menuentry "Umbrella OS — Live Boot (%ARCH%)" --class umbrella --class gnu-linux --id 'umbrella-os' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash plymouth.enable=1 loglevel=3 rd.udev.log_level=3
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Umbrella OS — Live Boot (Copy to RAM)" --class umbrella --class gnu-linux --id 'umbrella-os-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash plymouth.enable=1 copytoram
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System Restart' --class reboot {
    echo 'System restarting...'
    reboot
}

menuentry 'System Shutdown' --class shutdown {
    echo 'System shutting down...'
    halt
}
